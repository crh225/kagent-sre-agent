apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-vision-mcp
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-vision-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-vision-mcp
    spec:
      containers:
        - name: mcp
          image: kagent-vision-mcp:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-vision-gemini
                  key: GEMINI_API_KEY
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-vision-mcp
  namespace: kagent
spec:
  selector:
    app.kubernetes.io/name: kagent-vision-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: kagent-vision-mcp
  namespace: kagent
spec:
  description: Describe public images with Gemini Vision.
  protocol: STREAMABLE_HTTP
  url: http://kagent-vision-mcp.kagent.svc.cluster.local:8080/mcp
  timeout: 60s
