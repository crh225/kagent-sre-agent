apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-vision-mcp
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-vision-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-vision-mcp
    spec:
      containers:
        - name: mcp
          image: kagent-vision-mcp:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: http://host.docker.internal:11434
            - name: OLLAMA_MODEL
              value: qwen3.6:27b
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/var/run/kagent-extra-ca
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: extra-ca
              mountPath: /var/run/kagent-extra-ca
              readOnly: true
      volumes:
        - name: extra-ca
          configMap:
            name: kagent-vision-extra-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-vision-mcp
  namespace: kagent
spec:
  selector:
    app.kubernetes.io/name: kagent-vision-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: kagent-vision-mcp
  namespace: kagent
spec:
  description: Describe public images with local Ollama Vision.
  protocol: STREAMABLE_HTTP
  url: http://kagent-vision-mcp.kagent.svc.cluster.local:8080/mcp
  timeout: 60s
