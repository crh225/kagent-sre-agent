apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: flux-investigator
  namespace: kagent-sre
spec:
  kagent: {}
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:f62e9f2820d3325ca147a5d39802dc3e9c914bee97b3e021bd38f6f5df10e3bf
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: flux-mcp
  namespace: kagent-sre
spec:
  description: Read-only Flux status for the Flux investigator.
  url: http://flux-mcp.kagent-sre.svc.cluster.local:8080/mcp
  protocol: STREAMABLE_HTTP
  timeout: 15s
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: flux-investigator
  namespace: kagent-sre
spec:
  description: Read-only Flux reconciliation investigator.
  modelConfig:
    name: REPLACE_WITH_MODEL_CONFIG
  systemPrompt: |-
    You investigate Flux reconciliation failures. Use only flux_get_status.
    Report evidence from the resource status and conditions. Never suggest or
    perform direct cluster changes, reconciliation requests, GitHub actions,
    or secret access.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: flux-mcp
        tools:
          - flux_get_status
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: flux-investigator
  namespace: kagent-sre
spec:
  template:
    ref:
      name: flux-investigator
  harnessRef:
    name: flux-investigator
