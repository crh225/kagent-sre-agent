apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp
  namespace: kagent-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-mcp-reader
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-reader
subjects:
  - kind: ServiceAccount
    name: flux-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-mcp-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-mcp
  namespace: kagent-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flux-mcp
    spec:
      serviceAccountName: flux-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flux-mcp
          image: ghcr.io/crh225/kagent-sre-agent:REPLACE_WITH_IMAGE_TAG
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: flux-mcp
  namespace: kagent-sre
spec:
  selector:
    app.kubernetes.io/name: flux-mcp
  ports:
    - port: 8080
      targetPort: 8080
