<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kagent Vision Activity</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #080b14; color: #eef2ff; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #1d2b5b 0, transparent 38%), #080b14; }
    header { display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:auto; padding:24px; }
    .brand { display:flex; gap:12px; align-items:center; font-size:20px; font-weight:700; } .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; background:#7c5cff; }
    .badge { color:#b9ffcf; background:#123d2e; border:1px solid #286a50; padding:6px 10px; border-radius:999px; font-size:12px; }
    main { max-width:1200px; margin:auto; padding:0 24px 24px; display:grid; grid-template-columns: 1.7fr .9fr; gap:18px; }
    .panel { background:rgba(13,18,33,.88); border:1px solid #273351; border-radius:16px; overflow:hidden; box-shadow:0 20px 70px rgba(0,0,0,.25); }
    .panel-head { padding:16px 18px; border-bottom:1px solid #273351; display:flex; justify-content:space-between; align-items:center; }
    .panel-head h2 { font-size:14px; letter-spacing:.03em; margin:0; } .muted { color:#99a5c5; font-size:12px; }
    #conversation { padding:20px; min-height:480px; display:flex; flex-direction:column; gap:16px; }
    .message { max-width:86%; padding:13px 15px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
    .user { align-self:end; background:#6452d8; } .agent { background:#19233b; border:1px solid #2d3e64; } .empty { color:#9aa7c7; margin:auto; text-align:center; }
    form { display:flex; gap:10px; padding:16px; border-top:1px solid #273351; } input { min-width:0; flex:1; border:1px solid #3a4b77; border-radius:10px; padding:13px; color:inherit; background:#0b1020; font:inherit; } button { border:0; border-radius:10px; color:white; background:#7357ef; font-weight:700; padding:0 18px; cursor:pointer; } button:disabled { opacity:.55; cursor:wait; }
    #activity { list-style:none; padding:12px 18px 20px; margin:0; display:flex; flex-direction:column; gap:11px; } .event { border-left:2px solid #536a9d; padding-left:11px; font-size:13px; } .event .time { color:#8d9bbd; font-size:11px; margin-top:3px; } .event.tool { border-color:#ffb45c; } .event.done { border-color:#5ce6ad; } .event.fail { border-color:#ff7591; }
    .session { padding:14px 18px; border-top:1px solid #273351; font-family:ui-monospace, monospace; font-size:11px; color:#99a5c5; word-break:break-all; }
    @media (max-width: 760px) { main { grid-template-columns:1fr; padding:0 12px 12px; } header { padding:16px 12px; } #conversation { min-height:360px; } }
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark">✦</div>Kagent Vision Activity</div><div class="badge">local kind · Agent Substrate</div></header>
  <main>
    <section class="panel">
      <div class="panel-head"><h2>Conversation</h2><span class="muted">Streams from kagent A2A</span></div>
      <div id="conversation"><div id="empty" class="empty">Paste a public HTTPS image URL to see the agent, tool, and response activity.</div></div>
      <form id="chat"><input id="message" autocomplete="off" placeholder="https://example.com/image.jpg" aria-label="Message"><button id="submit">Analyze</button></form>
    </section>
    <aside class="panel">
      <div class="panel-head"><h2>Agent activity</h2><span id="state" class="muted">idle</span></div>
      <ul id="activity"></ul>
      <div id="session" class="session">Session will be created on your first request.</div>
    </aside>
  </main>
  <script>
    let contextId = "";
    let activityCursor = 0;
    const conversation = document.querySelector("#conversation");
    const activity = document.querySelector("#activity");
    const state = document.querySelector("#state");
    const session = document.querySelector("#session");
    const form = document.querySelector("#chat");
    const input = document.querySelector("#message");
    const submit = document.querySelector("#submit");

    function addMessage(kind, text) {
      document.querySelector("#empty")?.remove();
      const item = document.createElement("div");
      item.className = "message " + kind;
      item.textContent = text;
      conversation.append(item);
      conversation.scrollTop = conversation.scrollHeight;
      return item;
    }
    function addActivity(label, detail, css = "") {
      const item = document.createElement("li");
      item.className = "event " + css;
      item.innerHTML = "<strong></strong><div></div><div class='time'></div>";
      item.querySelector("strong").textContent = label;
      item.querySelector("div").textContent = detail;
      item.querySelector(".time").textContent = new Date().toLocaleTimeString();
      activity.prepend(item);
    }
    function textParts(parts) { return (parts || []).map(p => p.text || "").join(""); }
    function processEvent(payload, agentMessage) {
      const result = payload.result || {};
      if (result.statusUpdate) {
        const status = result.statusUpdate.status.state.replace("TASK_STATE_", "").toLowerCase();
        state.textContent = status;
        addActivity("Agent status", status, status === "working" ? "tool" : "");
      }
      if (result.artifactUpdate) {
        const update = result.artifactUpdate;
        const text = textParts(update.artifact?.parts);
        if (text) agentMessage.textContent = update.append ? agentMessage.textContent + text : text;
        if (update.contextId) setContext(update.contextId);
      }
      if (result.task) {
        const task = result.task;
        if (task.contextId) setContext(task.contextId);
        const taskState = task.status?.state?.replace("TASK_STATE_", "").toLowerCase();
        if (taskState) { state.textContent = taskState; addActivity("Task", taskState, taskState === "completed" ? "done" : ""); }
        const usage = task.metadata?.["https://kagent.dev/extensions/usage/v1"];
        if (usage) addActivity("Model usage", `${usage.inputTokens || 0} input · ${usage.outputTokens || 0} output tokens`, "done");
      }
    }
    function setContext(value) { contextId = value; session.textContent = "Session: " + value; }
    async function refreshToolActivity() {
      try {
        const response = await fetch("/api/activity");
        const body = await response.json();
        const events = body.events || [];
        for (const event of events.slice(activityCursor)) {
          addActivity("MCP " + event.tool, event.phase + " · " + event.detail, event.phase === "completed" ? "done" : event.phase === "failed" ? "fail" : "tool");
        }
        activityCursor = events.length;
      } catch (_) {}
    }
    setInterval(refreshToolActivity, 1000);
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      submit.disabled = true;
      addMessage("user", message);
      const agentMessage = addMessage("agent", "Starting agent session…");
      addActivity("Request", "Sent to kagent", "tool");
      state.textContent = "working";
      try {
        const response = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message, contextId}) });
        if (!response.ok || !response.body) throw new Error(await response.text());
        const reader = response.body.getReader(), decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const {value, done} = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, {stream:true});
          const records = buffer.split("\n\n");
          buffer = records.pop();
          for (const record of records) {
            const data = record.split("\n").filter(line => line.startsWith("data:")).map(line => line.slice(5).trim()).join("\n");
            if (data) processEvent(JSON.parse(data), agentMessage);
          }
        }
      } catch (error) {
        agentMessage.textContent = "Request failed: " + error.message;
        addActivity("Request", error.message, "fail");
        state.textContent = "failed";
      } finally {
        submit.disabled = false;
        refreshToolActivity();
      }
    });
  </script>
</body>
</html>
